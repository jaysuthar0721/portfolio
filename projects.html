  <template id="project-variable-geometry-drone">
    <article class="project-detail" data-project-slug="variable-geometry-drone">
      <header class="project-detail-header">
        <p class="project-meta">Project 01 / MECH 307 / Spring 2026</p>
        <h2 class="project-title" id="project-dialog-title">Variable Geometry Drone</h2>
        <p class="drone-lede">A reconfigurable quadcopter built around a custom ESP32 flight controller, with wireless commands and attitude-control testing on a two-axis stand.</p>
        <p class="drone-credit"><strong>My focus:</strong> Electronics architecture and flight controls.<br><strong>Team:</strong> Owen Geiss, Jay Suthar, and Tabitha Kwiatkowski.</p>
      </header>

      <figure class="drone-figure project-detail-hero">
        <a href="images/drone/configurations.webp" target="_blank" rel="noopener" aria-label="Open full-size image: Top views of the drone with its arms extended and folded"><img src="images/drone/configurations.webp" alt="Top views of the drone with its arms extended and folded" width="916" height="461" loading="lazy" decoding="async"></a>
        <figcaption>Two arm configurations from the mechanical design. The mechanism moved by hand in static tests; powered reconfiguration was not achieved in the final demonstration.</figcaption>
      </figure>

      <dl class="drone-facts">
        <div><dt>Flight computer</dt><dd>ESP32 + MPU-6050</dd></div>
        <div><dt>Motor interface</dt><dd>DSHOT300</dd></div>
        <div><dt>Firmware loop target</dt><dd>250 Hz</dd></div>
        <div><dt>Test-stand stabilization</dt><dd>Approximately 1 second</dd></div>
      </dl>

      <div class="project-block"><h3 class="project-block-label">Background</h3><div class="drone-copy"><p>Our team set out to build a drone whose secondary arms could change orientation through servo-driven spur gears. The challenge was to integrate that mechanism with power distribution, wireless input, sensing, and a flight controller within one semester.</p><p>The mechanical design used mirrored gear trains and connecting rods to move the arms while maintaining propeller clearance. My focus was the electronics and control system: receiving commands, estimating attitude, and turning that feedback into motor corrections.</p></div></div>

      <div class="project-block"><h3 class="project-block-label">Electronics &amp; communication</h3><div class="drone-copy"><p>The drone used a 14.8 V, 1300 mAh 4S battery, regulated 5 V and 3.3 V supplies, and a four-in-one ESC. A second ESP32 connected to a PS2 controller sent commands over ESP-NOW, while stabilization ran locally on the drone.</p><p>I integrated the MPU-6050 over I2C and worked through the motor interface. Standard servo-control code did not work for the brushless motor setup, so I switched to DSHOT. The report’s final firmware uses DSHOT300 and includes a 500 ms communication-timeout disarm condition. That timeout is a firmware setting, not a measured safety-validation result.</p></div></div>

      <figure class="drone-figure">
        <a href="images/drone/controller.webp" target="_blank" rel="noopener"><img src="images/drone/controller.webp" alt="PS2 gamepad beside its wired ESP32 interface board on a workbench" width="720" height="408" loading="lazy" decoding="async"></a>
        <figcaption>The operator interface: PS2 controller, ESP32 board, packet-status LEDs, and a startup buzzer.</figcaption>
      </figure>

      <div class="project-block"><h3 class="project-block-label">Attitude control</h3><div class="drone-copy"><p>I used a complementary filter to combine accelerometer and gyroscope measurements for roll and pitch, with the MPU-6050’s 44 Hz low-pass filter to reduce motor vibration in the feedback. The firmware targets a 250 Hz control loop; the report does not establish a measured loop rate.</p><p>I tuned the controller on the test stand. The integral term made the response too aggressive at our tuning stage, so I set its gain to zero and continued with proportional and derivative control. The motor mixer combined the attitude corrections with throttle to command the four motors.</p><p>The team also used Simulink to examine controller response, including a change in moment of inertia associated with folding the arms. Those plots show simulation behavior, not measured flight performance.</p></div></div>

      <div class="drone-gallery">
        <figure class="drone-figure"><a href="images/drone/simulation-model.webp" target="_blank" rel="noopener"><img src="images/drone/simulation-model.webp" alt="Simulink block diagram of the drone attitude-control model" width="1170" height="493" loading="lazy" decoding="async"></a><figcaption>Attitude-control simulation with preset inputs.</figcaption></figure>
        <figure class="drone-figure"><a href="images/drone/simulation-response.webp" target="_blank" rel="noopener"><img src="images/drone/simulation-response.webp" alt="Simulink scope showing three simulated response traces" width="940" height="566" loading="lazy" decoding="async"></a><figcaption>Simulated response; the report identifies the green trace with a change in moment of inertia.</figcaption></figure>
      </div>

      <div class="project-block"><h3 class="project-block-label">Test setup</h3><div class="drone-copy"><p>The team developed three test-stand iterations. The first allowed motion about one axis; the second added roll and pitch rotation. Integration exposed a propeller-clearance problem, which prompted a third version for the final demonstration. Yaw was outside the test scope.</p></div></div>

      <figure class="drone-figure">
        <a href="images/drone/test-stand.webp" target="_blank" rel="noopener"><img src="images/drone/test-stand.webp" alt="Two-axis test stand with a rectangular frame and central drone mount" width="1170" height="663" loading="lazy" decoding="async"></a>
        <figcaption>The later test-stand design pictured in the report.</figcaption>
      </figure>

      <div class="project-block"><h3 class="project-block-label">Results</h3><div class="drone-copy"><p><strong>The drone self-stabilized for approximately one second on the constrained stand before its response diverged.</strong> The controller generated corrective motor commands from sensor feedback, but sustained hover was not achieved.</p><p>The 9 g servos could not overcome the loads on the extended arms under gravity and motor vibration. We fixed the arms with adhesive for the final evaluation. The linkage worked when moved by hand, but the project did not demonstrate powered geometry changes during flight.</p><p>The report records reliable wireless commands, working arm/disarm and emergency-stop inputs, and consistent sensor feedback during testing. That gave us an integrated electronics platform, with actuator sizing and controller tuning still unresolved.</p></div></div>

      <div class="project-block"><h3 class="project-block-label">What I learned</h3><div class="drone-copy"><p>An unsecured battery-voltage wire contacted the 3.3 V rail and damaged the ESP32 and IMU. That failure made connector identification, insulation, and wire restraint part of the engineering work rather than a final assembly task.</p><p>I would begin motor and sensor integration earlier and budget more time for the edit-upload-test cycle. The next mechanical iteration would need actuator torque calculations and load testing, along with tighter control of printed gear tolerances, before another attempt at powered reconfiguration.</p></div></div>

      <p class="drone-source">Source: <cite>Variable Geometry Drone, Final Design Report</cite>, Owen Geiss, Jay Suthar, and Tabitha Kwiatkowski, May 8, 2026.</p>
    </article>
  </template>

  <template id="project-pid-simulink">
    <article class="project-detail" data-project-slug="pid-simulink">
      <header class="project-detail-header">
        <p class="project-meta">Project 04 / Controls / 2026</p>
        <h2 class="project-title" id="project-dialog-title"><span translate="no">PID</span> Motor Control with <span translate="no">Simulink</span></h2>
        <p class="project-detail-lede">A control-system study using Simulink PID blocks to examine roll response, motor mixing, and the effect of changing vehicle geometry.</p>
      </header>
      <figure class="drone-figure project-detail-hero">
        <a href="images/drone/simulation-model.webp" target="_blank" rel="noopener"><img src="images/drone/simulation-model.webp" alt="Simulink block diagram used for drone attitude-control simulation" width="1170" height="493" loading="lazy" decoding="async"></a>
        <figcaption>Simulink model used to examine attitude-control response.</figcaption>
      </figure>
      <div class="project-block"><h3 class="project-block-label">Controls approach</h3><div class="drone-copy"><p>The study used built-in Simulink PID blocks in a drone-control context, beginning with a single-axis roll model and extending toward motor mixing and moving-arm effects. The purpose was to understand controller response before relying on hardware-only tuning.</p><p>This work overlaps with the Variable Geometry Drone project, where the final hardware controller used proportional and derivative control after the integral term proved too aggressive during test-stand tuning.</p></div></div>
    </article>
  </template>

        <p class="project-detail-lede">The longest project in my manufacturing course: a functional clock assembled from an aluminum base, brass and steel pen holders, an acrylic face, and a standard clock mechanism.</p>

      <div class="project-detail-schematic" aria-hidden="true">
        <svg viewBox="0 0 900 360">
          <path class="detail-grid" d="M0 90H900M0 180H900M0 270H900M150 0V360M300 0V360M450 0V360M600 0V360M750 0V360"></path>

          <path class="detail-secondary" d="M330 38H570M330 29V47M570 29V47M720 66V320M711 66H729M711 320H729"></path>
        </svg>
      </div>

      <dl class="drone-facts">
        <div><dt>Course</dt><dd>MECH 200A</dd></div>
        <div><dt>Tracked labor</dt><dd>57 hours</dd></div>
        <div><dt>Processes</dt><dd>Lathe / mill / CNC</dd></div>
        <div><dt>Completion</dt><dd>Fall 2024</dd></div>
      </dl>

      <div class="project-block">
        <h3 class="project-block-label">Build</h3>
        <div class="drone-copy">
          <p>This project required careful tolerance control across several parts rather than one isolated machining operation. The original build combined a machined aluminum base, separate brass and steel pen holders, an acrylic clock face, and the clock mechanism itself.</p>
          <p>I used the project as a practical introduction to sequencing work across manual machines and the HAAS CNC mill. Machine availability also mattered: the lathe, manual mill, and CNC mill became increasingly busy as class deadlines approached.</p>
        </div>
      </div>

      <div class="project-block">
        <h3 class="project-block-label">Cost &amp; time</h3>
        <div class="drone-copy">
          <p>My original estimate tracked 57 total labor hours at a class labor rate of $20 per hour, or $1,140 in labor before material and component costs. The material estimate included brass and steel bar stock for the pen holders, aluminum stock for the clock base, acrylic sheet for the face, and a standard clock mechanism.</p>
          <p>The largest time allocations in the original log were the brass pen holder, steel pen holder, and aluminum base. That made the project useful for seeing how manual operations dominate cost when a one-off student process is extrapolated beyond a prototype.</p>
        </div>
      </div>

      <div class="project-block">
        <h3 class="project-block-label">Process improvement</h3>
        <div class="drone-copy">
          <p>The main improvement I identified was to move repetitive manual work onto CNC equipment. The brass and steel holders could be produced on a CNC lathe, including tapping operations, while the aluminum base could be rough-cut on the horizontal bandsaw and finished on the CNC mill.</p>
          <p>The lesson was not simply “use CNC.” It was to reserve manual operations for the steps that actually benefit from them and automate the geometry that is repetitive and well constrained.</p>
        </div>
      </div>

      <div class="project-block">
        <h3 class="project-block-label">What I learned</h3>
        <div class="drone-copy">
          <p>This was the first major manufacturing project in the course, and the biggest lesson was scheduling. Starting early mattered because machine queues became a real constraint. I also learned to treat TA check-ins and rework as part of the process instead of assuming each part would be correct on the first attempt.</p>
        </div>
      </div>

      <div class="project-block">
        <h3 class="project-block-label">Build</h3>
        <div class="drone-copy">
          <p>This project moved beyond conventional cutting operations into forging and heat treatment. The screwdriver used a steel shaft and an aluminum handle blank, with machining and finishing steps distributed across the CNC lathe, knurling setup, forging operation, and grinding.</p>
          <p>The original cost estimate used $8.45 of steel shaft stock, $7.80 for the aluminum blank, and 28 labor hours at $20 per hour, producing the class estimate of $576.25 for one screwdriver.</p>
        </div>
      </div>

      <div class="project-block">
        <h3 class="project-block-label">Machining lessons</h3>
        <div class="drone-copy">
          <p>Workholding mattered more than I expected. When turning the shaft, I found it better to clamp from the steel rod rather than the aluminum section, and the CNC lathe tailstock needed to be firmly seated against the center-drilled hole to avoid leaving an excessive uncut region.</p>
          <p>Knurling also made the speed-feed relationship visible in the finished surface. Slower spindle speed produced a more defined pattern, while feed affected the spacing. The project made setup quality just as important as the nominal toolpath.</p>
        </div>
      </div>

      <div class="project-block">
        <h3 class="project-block-label">Process improvement</h3>
        <div class="drone-copy">
          <p>For a repeatable production process, I would separate the steel shaft and aluminum handle operations rather than asking one partially assembled part to survive every setup. A dedicated mandrel would improve support during knurling, and a keyed interface between the shaft and handle would make the final joint easier to control.</p>
          <p>I also proposed a grinding fixture that holds the screwdriver at a fixed angle. That would replace hand-positioning and make tip geometry more consistent from part to part.</p>
        </div>
      </div>
